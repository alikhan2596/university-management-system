name: UMS CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Unit Tests
        env:
          SECRET_KEY: ci-test-secret-key
          SESSION_MINUTES: "30"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -v

      - name: Run Bandit Security Scan
        run: |
          bandit -r app.py feature_routes.py seed.py -ll

      - name: Build Application Artifact
        run: |
          mkdir -p build
          zip -r build/ums-build-${{ github.sha }}.zip \
            app.py \
            feature_routes.py \
            schema.sql \
            seed.py \
            requirements.txt \
            templates \
            static \
            scripts

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ums-build-${{ github.sha }}
          path: build/ums-build-${{ github.sha }}.zip

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload Build to Amazon S3
        run: |
          aws s3 cp \
            build/ums-build-${{ github.sha }}.zip \
            s3://alikhan2596-ums-cicd-artifacts/releases/ums-build-${{ github.sha }}.zip

          aws s3 cp \
            build/ums-build-${{ github.sha }}.zip \
            s3://alikhan2596-ums-cicd-artifacts/releases/latest.zip

      - name: Deploy to Amazon EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy UMS ${{ github.sha }}" \
            --parameters 'commands=[
              "set -e",
              "mkdir -p /tmp/ums",
              "aws s3 cp s3://alikhan2596-ums-cicd-artifacts/releases/latest.zip /tmp/ums/latest.zip",
              "rm -rf /tmp/ums/package",
              "mkdir -p /tmp/ums/package",
              "unzip -o /tmp/ums/latest.zip -d /tmp/ums/package",
              "chmod +x /tmp/ums/package/scripts/deploy_ec2.sh",
              "/tmp/ums/package/scripts/deploy_ec2.sh"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
