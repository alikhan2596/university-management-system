name: UMS CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Unit Tests
        env:
          SECRET_KEY: ci-test-secret-key
          SESSION_MINUTES: "30"
        run: |
          pytest -v

      - name: Run Bandit Security Scan
        run: |
          bandit -r app.py feature_routes.py seed.py -ll

      - name: Build Application Artifact
        run: |
          mkdir -p build

          zip -r build/ums-build-${{ github.sha }}.zip \
            app.py \
            feature_routes.py \
            schema.sql \
            requirements.txt \
            templates \
            static \
            -x "*.db" ".env" "__pycache__/*"

      - name: Upload Build Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ums-build-${{ github.sha }}
          path: build/ums-build-${{ github.sha }}.zip
