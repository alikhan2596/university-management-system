{% extends 'base.html' %}{% block body %}<section class="login-shell"><div class="login-card"><img src="{{url_for('static',filename='images/logo.svg')}}" class="logo"><h1>University Management System</h1><p>Authorized users only</p><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Username</label><input name="username" autocomplete="username" required><label>Password</label><div class="password"><input id="pw" type="password" name="password" autocomplete="current-password" required><button type="button" onclick="pw.type=pw.type==='password'?'text':'password'">Show</button></div><button class="primary">Sign in</button></form></div></section>{% endblock %}
