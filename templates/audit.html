{% extends 'base.html' %}{% block body %}<h1>Audit Log</h1><section class="panel"><table><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>Details</th></tr>{% for x in rows %}<tr><td>{{x.created_at}}</td><td>{{x.display_name or 'System'}}</td><td>{{x.action}}</td><td>{{x.entity}} #{{x.entity_id or ''}}</td><td>{{x.details}}</td></tr>{% endfor %}</table></section>{% endblock %}
