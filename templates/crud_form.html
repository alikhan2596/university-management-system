{% extends 'base.html' %}{% block body %}<div class="form-card"><h1>{{title}}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">{% for f in fields %}<label>{{f.replace('_',' ')|title}}</label>{% if 'date' in f %}<input type="date" name="{{f}}" required>{% elif f=='status' %}<select name="status"><option>Planned</option><option>Active</option><option>Closed</option></select>{% else %}<input name="{{f}}" required>{% endif %}{% endfor %}<button class="primary">Save</button></form></div>{% endblock %}
