{% extends 'base.html' %}{% block body %}<h1>Assessments · {{course.code}} · {{course.section}}</h1><form class="form-card" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Name</label><input name="name" required><label>Type</label><select name="type"><option>Quiz</option><option>Assignment</option><option>Exam</option><option>Project</option></select><label>Maximum Marks</label><input type="number" step="0.01" name="max_marks" required><label>Weight %</label><input type="number" step="0.01" name="weight" required><label>Date</label><input type="date" name="assessment_date" required><button class="primary">Create Assessment</button></form><section class="panel"><table><tr><th>Name</th><th>Type</th><th>Max Marks</th><th>Weight</th><th>Date</th><th>Results</th></tr>{% for x in rows %}<tr><td>{{x.name}}</td><td>{{x.type}}</td><td>{{x.max_marks}}</td><td>{{x.weight}}%</td><td>{{x.assessment_date}}</td><td><a href="/teacher/results/{{x.id}}">Enter / Update ({{x.result_count}})</a></td></tr>{% endfor %}</table></section>{% endblock %}
