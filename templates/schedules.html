{% extends 'base.html' %}{% block body %}<h1>Class Timetable</h1><form class="form-card" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Course Offering</label><select name="offering_id">{% for x in offerings %}<option value="{{x.id}}">{{x.label}}</option>{% endfor %}</select><label>Room</label><select name="room_id">{% for x in rooms %}<option value="{{x.id}}">{{x.label}}</option>{% endfor %}</select><label>Day</label><select name="day_of_week">{% for d in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'] %}<option>{{d}}</option>{% endfor %}</select><label>Start</label><input type="time" name="start_time"><label>End</label><input type="time" name="end_time"><button class="primary">Schedule</button></form><section class="panel"><table><tr><th>Day</th><th>Time</th><th>Course</th><th>Section</th><th>Teacher</th><th>Room</th></tr>{% for x in rows %}<tr><td>{{x.day_of_week}}</td><td>{{x.start_time}}–{{x.end_time}}</td><td>{{x.code}}</td><td>{{x.section}}</td><td>{{x.teacher}}</td><td>{{x.room_no}}</td></tr>{% endfor %}</table></section>{% endblock %}
