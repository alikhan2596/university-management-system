{% extends 'base.html' %}{% block body %}<h1>My Courses</h1><div class="course-grid">{% for x in rows %}<section class="panel"><h2>{{x.code}} · {{x.name}}</h2><p><b>Section:</b> {{x.section}} | <b>Semester:</b> {{x.semester}}</p><p><b>Students:</b> {{x.students}}</p><p><b>Schedule:</b> {{x.schedule or 'Not scheduled'}}</p><a class="primary" href="/teacher/course/{{x.id}}">Open Course</a></section>{% endfor %}</div>{% endblock %}
