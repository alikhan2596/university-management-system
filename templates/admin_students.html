{% extends 'base.html' %}{% block body %}<div class="page-head"><h1>Students</h1><form method="get"><input name="q" value="{{q}}" placeholder="Search name or registration"><button class="primary">Search</button></form></div><section class="panel"><table><tr><th>Registration</th><th>Name</th><th>Department</th><th>Section</th><th>Courses</th><th>Status</th></tr>{% for x in rows %}<tr><td>{{x.registration_no}}</td><td>{{x.display_name}}<br><small>{{x.email}}</small></td><td>{{x.department}}</td><td>{{x.section}}</td><td>{{x.courses}}</td><td>{{x.status}}</td></tr>{% endfor %}</table></section>{% endblock %}
